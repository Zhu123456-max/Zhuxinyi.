          degree: '专科 · 2026级',
          grad: '预计毕业：2029年7月',
          gpa: 'GPA：待出 / 4.0',
          courses: 'Python程序设计、数据库原理与应用、大数据采集与预处理、数据可视化技术、计算机网络基础、高等数学'
        },
        certs: [
          '阿里云 Apsara Clouder 专项技能证书 | 云计算/大数据相关 | 2026年',
          '人工智能高级训练师证书 | 2026年',
          '人工智能初级训练师证书 | 2026年',
          '英语四级/六级 CET-4/6 | 备考中'
        ],
        // 新增证书图片配置
        certImages: [
          { file: 'picture1.jpg', title: '阿里云 Apsara Clouder 专项技能证书' },
          { file: 'picture2.jpg', title: '人工智能高级训练师证书' },
          { file: 'picture3.jpg', title: '人工智能初级训练师证书' }
        ]
      };

      const main = document.getElementById('mainContent');
      const themeToggle = document.getElementById('themeToggle');
      const printBtn = document.getElementById('printBtn');
      const backToTop = document.getElementById('backToTop');
      const html = document.documentElement;

      // 主题切换
      const setTheme = (dark) => {
        html.setAttribute('data-theme', dark ? 'dark' : 'light');
        localStorage.setItem('theme', dark ? 'dark' : 'light');
      };
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') setTheme(true);
      else if (saved === 'light') setTheme(false);
      else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        setTheme(prefersDark);
      }
      themeToggle.addEventListener('click', () => {
        setTheme(html.getAttribute('data-theme') !== 'dark');
      });

      printBtn.addEventListener('click', () => window.print());

      // 返回顶部
      const toggleBackToTop = () => {
        if (window.scrollY > 400) backToTop.classList.add('visible');
        else backToTop.classList.remove('visible');
      };
      window.addEventListener('scroll', toggleBackToTop, { passive: true });
      backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

      function render() {
        const emailDisplay = resume.email || '邮箱待补';
        const certImagesHtml = resume.certImages.map(img => `
          <div class="cert-img-card">
            <img src="${img.file}" alt="${img.title}" loading="lazy" onclick="window.open('${img.file}', '_blank')">
            <div class="cert-img-caption">${img.title}</div>
          </div>
        `).join('');

        const htmlStr = `
        <section id="hero">
          <div class="hero">
            <div class="hero-text">
              <h1>${resume.name}</h1>
              <p class="subtitle">${resume.subtitle}</p>
              <div class="badge-row">
                <span class="badge">📍 ${resume.city}</span>
                <span class="badge">📞 ${resume.phone}</span>
                <span class="badge" id="emailBadge" title="点击复制邮箱">✉️ ${emailDisplay}</span>
              </div>
              <div class="btn-group">
                <a class="btn btn-primary" href="tel:${resume.phone}">📞 拨打电话</a>
                <button class="btn btn-outline" id="copyEmailBtn">📋 复制邮箱</button>
                ${resume.github ? `<a class="btn btn-outline" href="${resume.github}" target="_blank">🔗 GitHub</a>` : ''}
              </div>
            </div>
            <div class="hero-avatar" aria-hidden="true">朱</div>
          </div>
        </section>

        <section id="highlights">
          <h2 class="section-title">亮点速览</h2>
          <div class="highlights-grid">
            ${resume.highlights.map(h => `<div class="highlight-card"><div class="number">${h.number}</div><div class="label">${h.label}</div></div>`).join('')}
          </div>
        </section>

        <section id="experience">
          <h2 class="section-title">实践经历</h2>
          <div class="tabs" role="tablist" aria-label="经历分类">
            ${resume.experienceTabs.map((t, i) => `<button class="tab-btn ${i===0?'active':''}" role="tab" aria-selected="${i===0?'true':'false'}" data-tab="${t.id}">${t.label}</button>`).join('')}
          </div>
          ${resume.experienceTabs.map((t, i) => `
          <div class="tab-panel ${i===0?'active':''}" id="panel-${t.id}" role="tabpanel">
            ${t.items.map(exp => `
            <div class="card">
              <div class="card-header"><h3>${exp.title}</h3><span class="meta">${exp.date}</span></div>
              <div class="card-sub">${exp.org}</div>
              <ul>${exp.details.map(d => `<li>${d}</li>`).join('')}</ul>
            </div>`).join('')}
          </div>`).join('')}
        </section>

        <section id="projects">
          <h2 class="section-title">项目经历</h2>
          <div class="tabs" role="tablist" aria-label="项目分类">
            <button class="tab-btn active" role="tab" aria-selected="true" data-tab="all-proj">全部项目</button>
          </div>
          <div class="tab-panel active" id="panel-all-proj" role="tabpanel">
            <div class="project-grid">
              ${resume.projects.map(p => `
              <div class="project-card">
                <h3 style="font-size:1rem;">${p.name}</h3>
                <div class="tech-tags">${p.tech.map(t => `<span class="tech-tag">${t}</span>`).join('')}</div>
                <p style="font-size:0.85rem;color:var(--text2);">${p.desc}</p>
                <span style="font-size:0.75rem;color:var(--text2);margin-top:auto;">${p.date}</span>
              </div>`).join('')}
            </div>
          </div>
        </section>

        <section id="skills">
          <h2 class="section-title">技能矩阵</h2>
          <div class="skills-grid">
            ${resume.skills.map(s => `
            <div class="skill-cat">
              <h4>${s.cat}</h4>
              ${s.items.map(sk => {
                const level = Math.floor(Math.random()*30+60);
                return `<div class="skill-item"><span>${sk}</span><div class="skill-bar"><div class="skill-bar-fill" style="width:${level}%;"></div></div></div>`;
              }).join('')}
            </div>`).join('')}
          </div>
          <p style="font-size:0.7rem;color:var(--text2);margin-top:0.4rem;">* 进度条仅示意学习投入度，非精确量化</p>
        </section>

        <section id="education">
          <h2 class="section-title">教育背景 & 证书</h2>
          <div class="edu-cert-grid">
            <div class="card" style="height:fit-content;">
              <h3 style="font-size:1rem;">${resume.education.school}</h3>
              <p style="color:var(--primary);font-weight:600;">${resume.education.major}</p>
              <p style="font-size:0.85rem;color:var(--text2);">${resume.education.degree} · ${resume.education.grad}</p>
              <p style="font-size:0.8rem;color:var(--text2);">${resume.education.gpa}</p>
              <p style="font-size:0.78rem;color:var(--text2);margin-top:0.4rem;">核心课程：${resume.education.courses}</p>
            </div>
            <div class="card" style="height:fit-content;">
              <h3 style="font-size:1rem;margin-bottom:0.6rem;">获奖与证书</h3>
              <ul class="cert-list">
                ${resume.certs.map(c => `<li>🏅 ${c}</li>`).join('')}
              </ul>
            </div>
          </div>
          <!-- 证书图片展示区 -->
          <div class="cert-gallery">
            ${certImagesHtml}
          </div>
          <p style="font-size:0.7rem;color:var(--text2);margin-top:0.6rem;">📷 点击证书图片可查看大图</p>
        </section>
        `;
        main.innerHTML = htmlStr;
        bindEvents();
      }

      function bindEvents() {
        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            const tabId = this.getAttribute('data-tab');
            const parent = this.closest('section');
            parent.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
            parent.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            this.classList.add('active');
            this.setAttribute('aria-selected', 'true');
            const panel = parent.querySelector(`#panel-${tabId}`);
            if (panel) panel.classList.add('active');
          });
          btn.addEventListener('keydown', function(e) {
            const parent = this.closest('.tabs');
            const btns = Array.from(parent.querySelectorAll('.tab-btn'));
            const idx = btns.indexOf(this);
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
              e.preventDefault();
              const next = e.key === 'ArrowRight' ? (idx + 1) % btns.length : (idx - 1 + btns.length) % btns.length;
              btns[next].focus();
              btns[next].click();
            }
          });
        });

        const copyBtn = document.getElementById('copyEmailBtn');
        const emailBadge = document.getElementById('emailBadge');
        const emailAddr = resume.email || '';
        if (copyBtn && emailAddr) {
          copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(emailAddr).then(() => {
              copyBtn.textContent = '✅ 已复制';
              setTimeout(() => { copyBtn.textContent = '📋 复制邮箱'; }, 1800);
            }).catch(() => alert('复制失败，请手动复制：' + emailAddr));
          });
        }
        if (emailBadge && emailAddr) {
          emailBadge.style.cursor = 'pointer';
          emailBadge.addEventListener('click', () => {
            navigator.clipboard.writeText(emailAddr).then(() => {
              emailBadge.textContent = '✅ 已复制';
              setTimeout(() => { emailBadge.textContent = '✉️ ' + (resume.email || '邮箱待补'); }, 1800);
            }).catch(() => {});
          });
        }
      }

      document.addEventListener('click', function(e) {
        const link = e.target.closest('a[href^="#"]');
        if (link) {
          e.preventDefault();
          const id = link.getAttribute('href').slice(1);
          const el = document.getElementById(id);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });

      render();
      toggleBackToTop();
    })();
  </script>
</body>
</html>
